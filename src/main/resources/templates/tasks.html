<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Todo Application</h1>

    <form action="/" method="post" class="mb-4">
        <div class="input-group">
            <input type="text" name="title" class="form-control"
                   placeholder="Enter a task" required>
            <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
    </form>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:each="task : ${tasks}">

            <span th:text="${task.title}"
                  th:classappend="${task.completed} ? 'text-decoration-line-through' : ''">
                Task
            </span>

            <div>
                <a th:href="@{/{id}/toggle(id=${task.id})}"
                   class="btn btn-sm btn-success">Toggle</a>

                <a th:href="@{/{id}/delete(id=${task.id})}"
                   class="btn btn-sm btn-danger">Delete</a>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
